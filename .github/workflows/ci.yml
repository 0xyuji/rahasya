name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Cloudflare build
        run: npm run -w @pay/web cf:build
      - name: The verifier worker is still covered by its CSP
        run: npm run audit:csp
