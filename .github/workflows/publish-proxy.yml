# Stages a release of the local proxy on npm as `rahasya`, with npm trusted publishing
# (OIDC): no npm token is stored anywhere, and npm records provenance (which commit and
# workflow built it). The trusted publisher may ONLY stage: a release goes live when the
# owner approves it with their passkey (npmjs.com, or `npm stage approve <id>`). So even a
# compromised workflow or GitHub account can't ship a version on its own.
#
# Release: bump packages/proxy/npm/package.json "version", commit, then push a tag
# `proxy-v<version>` (e.g. proxy-v0.1.1). The job refuses if the tag and version differ.
#
# One-time setup on npmjs.com (package rahasya → Settings → Trusted publisher):
# GitHub Actions, owner 0xyuji, repository rahasya, workflow publish-proxy.yml,
# "Allow npm publish" and "Allow npm dist-tag" both unchecked (stage only).
name: publish-proxy

on:
  push:
    tags: ["proxy-v*"]

permissions:
  contents: read
  id-token: write # lets npm verify this run (OIDC); no secrets needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - name: Tag must match the package version
        run: |
          v=$(node -p 'require("./packages/proxy/npm/package.json").version')
          [ "proxy-v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != proxy-v$v"; exit 1; }
      - name: Test
        run: npm test -w @pay/proxy
      - name: Bundle
        run: |
          npm run -w @pay/proxy bundle
          cp packages/proxy/dist/rahasya.mjs packages/proxy/npm/rahasya.mjs
          cp LICENSE packages/proxy/npm/LICENSE
          cat packages/proxy/dist/rahasya.mjs.sha256
      - name: Stage for approval (staged publishing needs a recent npm 11)
        working-directory: packages/proxy/npm
        run: |
          npm install -g npm@^11.17.0
          npm stage publish . --access public
          echo "Staged. Approve it on npmjs.com or with: npm stage list rahasya && npm stage approve <id>"
